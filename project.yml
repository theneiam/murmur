# XcodeGen spec — run `xcodegen generate` to produce Murmur.xcodeproj.
# (brew install xcodegen). See README.md.
name: Murmur

options:
  bundleIdPrefix: com.yevhen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Per-configuration xcconfig. Contributors put their Team ID in the git-ignored
# Config/Local.xcconfig (see Config/Local.xcconfig.example); it is included
# optionally, so a fresh clone builds ad-hoc-signed with no edits.
configFiles:
  Debug: Config/Murmur.xcconfig
  Release: Config/Murmur.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    # DEVELOPMENT_TEAM is deliberately not here: it comes from the
    # git-ignored Config/Local.xcconfig (per developer) or, for releases,
    # from scripts/release.sh via $TEAM_ID. Do not set it in Xcode's Signing
    # tab either — `xcodegen generate` would drop it. Without a team the
    # build is ad-hoc signed and macOS re-asks for Accessibility/Microphone
    # after every rebuild; see Config/Murmur.xcconfig.
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    # Exact pin on purpose: Package.resolved lives inside the git-ignored
    # .xcodeproj, so this line is the only thing that makes builds
    # reproducible across machines and CI. Bump deliberately.
    exactVersion: "1.1.0"

targets:
  Murmur:
    type: application
    platform: macOS
    sources:
      - path: Murmur
        excludes:
          - "Info.plist"
          - "Murmur.entitlements"
      # Ship the licenses with every binary distribution. The Argmax notice
      # includes the Apache 2.0 terms for its swift-transformers-derived code.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      - path: Legal/ArgmaxOSS-NOTICES.txt
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Murmur/Info.plist
      properties:
        CFBundleName: Murmur
        CFBundleDisplayName: Murmur
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only — no Dock icon, no app switcher entry.
        LSUIElement: true
        NSMicrophoneUsageDescription: Murmur records your voice only while you hold the push-to-talk key, and transcribes it entirely on this Mac.
        NSHumanReadableCopyright: © 2026 Yevhen Nezhuta
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Murmur/Murmur.entitlements
      properties:
        # Not sandboxed: global event taps and AXUIElement writes into other
        # apps are not available to sandboxed apps.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        # Hardened-runtime exceptions are intentionally NOT needed: WhisperKit
        # is pure Swift + CoreML.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevhen.murmur
        PRODUCT_NAME: Murmur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  MurmurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MurmurTests
    dependencies:
      # Hosted in the app so tests can `@testable import Murmur`. The
      # AppDelegate skips start-up work (event tap, model load, onboarding)
      # when it detects XCTest, so running tests never interferes with a
      # Murmur instance already running.
      - target: Murmur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevhen.murmur.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        MURMUR_RUNNING_TESTS: "1"
      targets:
        - MurmurTests
    archive:
      config: Release
